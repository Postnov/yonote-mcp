<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mereal Reports</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-header" id="appHeader" style="display:none">
        <div class="header-inner">
            <div class="header-left">
                <button id="btnBack" class="header-back" style="display:none" title="К проектам">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    <span>Проекты</span>
                </button>
                <div class="header-brand" id="headerBrand">
                    <img src="/images/mereal-logo.svg" alt="Mereal" class="header-logo">
                </div>
            </div>
            <div class="header-right">
                <span id="userName" class="header-user-name" style="display:none"></span>
                <button id="btnUsers" class="header-btn" style="display:none" title="Пользователи">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Пользователи</span>
                </button>
                <button id="btnSettings" class="header-btn" style="display:none" title="Настройки">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span>Настройки</span>
                </button>
                <button id="btnLogout" class="header-btn header-btn--logout" style="display:none" title="Выйти">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Login view -->
    <div id="viewLogin" class="view"></div>

    <!-- Setup view (first admin creation) -->
    <div id="viewSetup" class="view"></div>

    <!-- Projects view -->
    <div id="viewProjects" class="view">
        <div class="projects-page">
            <div class="projects-header">
                <h1>Проекты</h1>
                <p class="projects-subtitle">Выберите проект или создайте новый</p>
            </div>
            <div id="projectsGrid" class="projects-grid"></div>
        </div>
    </div>

    <!-- Report view -->
    <div id="viewReport" class="view" style="display:none">
        <div class="app-layout">
            <main class="main-content">
                <div class="hero-section">
                    <h1>Создать отчёт</h1>
                    <p class="hero-subtitle">Выберите темы для сбора данных</p>
                </div>

                <h2 class="section-heading">Создать отчёт</h2>

                <div id="tagsSection" class="tags-section">
                    <div id="tagsGrid" class="tags-grid">
                        <div class="tags-loading">
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                        </div>
                    </div>
                </div>

                <div id="actionSection" class="action-section" style="display:none">
                    <button id="btnCreateReport" class="btn-create-report"></button>
                </div>

                <div id="progressSection" class="progress-section"></div>

                <div id="resultSection" class="result-section"></div>
            </main>
        </div>

        <!-- История — панель снизу, раскрывается вверх -->
        <div class="history-panel" id="historyPanel">
            <div class="history-panel-toggle" id="historyPanelToggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>История</span>
                <svg class="history-panel-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="history-panel-body">
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('historyPanelToggle').addEventListener('click', () => {
            document.getElementById('historyPanel').classList.toggle('is-open');
        });
</script>

    <!-- Admin view -->
    <div id="viewAdmin" class="view"></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
