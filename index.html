<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yonote Reports</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <button id="btnBack" class="header-back" style="display:none" title="К проектам">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <span>Проекты</span>
            </button>
            <div class="header-brand" id="headerBrand">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                <span>Yonote Reports</span>
            </div>
        </div>
        <button id="btnSettings" class="header-settings" title="Настройки">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </header>

    <!-- Projects view -->
    <div id="viewProjects" class="view">
        <div class="projects-page">
            <div class="projects-header">
                <h1>Проекты</h1>
                <p class="projects-subtitle">Выберите проект или создайте новый</p>
            </div>
            <div id="projectsGrid" class="projects-grid"></div>
        </div>
    </div>

    <!-- Report view -->
    <div id="viewReport" class="view" style="display:none">
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">История</span>
                </div>
                <div class="history-list" id="historyList"></div>
            </aside>

            <main class="main-content">
                <div class="hero-section">
                    <h1>Создать отчёт</h1>
                    <p class="hero-subtitle">Выберите темы для сбора данных</p>
                </div>

                <div id="tagsSection" class="tags-section">
                    <div id="tagsGrid" class="tags-grid">
                        <div class="tags-loading">
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                            <div class="tag-skeleton"></div>
                        </div>
                    </div>
                </div>

                <div id="actionSection" class="action-section" style="display:none">
                    <button id="btnCreateReport" class="btn-create-report"></button>
                </div>

                <div id="progressSection" class="progress-section"></div>

                <div id="resultSection" class="result-section"></div>
            </main>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
